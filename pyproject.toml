[tool.poetry]
name = "vpn-bot"
version = "0.1.0"
description = ""
authors = ["Alchemmist <anton.ingrish@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.0.1"
python-telegram-bot = "^21.4"
sqlalchemy-serializer = "^1.4.22"
prettytable = "^3.10.2"
python-dateutil = "^2.9.0.post0"
pytest = "^8.2.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.2"
ruff = "^0.3.3"
pyright = "^1.1.354"

[tool.ruff]
line-length = 88
exclude = [
    "**/__init__.py"
]

