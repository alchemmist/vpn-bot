repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff 
        entry: poetry run ruff check --fix
        language: system
        pass_filenames: false
        types: [python]
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: poetry run pyright
        language: system
        pass_filenames: false
        types: [python]
